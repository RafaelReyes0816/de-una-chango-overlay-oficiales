<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=800, height=80">
  <title>Alertas · Cassette Grunge</title>
  <link rel="stylesheet" href="css/chango.css">
  <style>
    .alert-wrap {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .alert-card {
      position: relative;
      display: none;
      width: 100%;
      height: 76px;
      align-items: center;
      gap: 16px;
      padding: 0 22px;
      border: 1px solid rgba(var(--accent-rgb), 0.55);
      border-radius: 16px;
      background: var(--card-bg);
      box-shadow: var(--card-shadow);
      overflow: hidden;
      animation: alertIn 0.45s var(--ease-out) both;
      will-change: transform, opacity;
    }

    .alert-card::after {
      content: "";
      position: absolute;
      left: 0;
      top: 12px;
      bottom: 12px;
      width: 4px;
      border-radius: 0 4px 4px 0;
      background: linear-gradient(180deg, var(--accent), var(--mostaza));
    }

    .alert-card.is-visible {
      display: flex;
    }

    .alert-card__icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: 1px solid rgba(var(--accent-rgb), 0.48);
      background: rgba(var(--accent-rgb), 0.16);
      color: var(--accent);
      font-family: var(--font-brand);
      font-size: 22px;
      font-weight: 900;
      flex: 0 0 auto;
    }

    .alert-card__body {
      min-width: 0;
      flex: 1;
    }

    .alert-card__label {
      color: var(--accent);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .alert-card__user {
      overflow: hidden;
      color: var(--blanco);
      font-family: var(--font-brand);
      font-size: 21px;
      font-weight: 900;
      line-height: 1.05;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .alert-card__detail {
      color: var(--mostaza);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    @keyframes alertIn {
      from {
        opacity: 0;
        transform: translate3d(0, -14px, 0) scale(0.97);
      }
      to {
        opacity: 1;
        transform: translate3d(0, 0, 0) scale(1);
      }
    }
  </style>
  <link rel="stylesheet" href="css/cassette-grunge.css">
</head>
<body class="scene scene-overlay">
  <div class="alert-wrap">
    <div class="alert-card" id="alert-card">
      <div class="alert-card__icon" id="alert-icon">+</div>
      <div class="alert-card__body">
        <div class="alert-card__label" id="alert-label">Nuevo seguidor</div>
        <div class="alert-card__user" id="alert-user">chango_fan</div>
        <div class="alert-card__detail" id="alert-detail">Gracias por sumarte a la banda</div>
      </div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/live.js"></script>
  <script>
    (function () {
      var card = document.getElementById("alert-card");
      var icon = document.getElementById("alert-icon");
      var label = document.getElementById("alert-label");
      var user = document.getElementById("alert-user");
      var detail = document.getElementById("alert-detail");
      var hideTimer = null;

      function hideAlert() {
        window.clearTimeout(hideTimer);
        card.classList.remove("is-visible");
      }

      function showAlert(payload) {
        var data = payload || {};
        var accent = data.accent || "turquesa";
        card.setAttribute("data-accent", accent);
        icon.textContent = data.icon || "+";
        label.textContent = data.label || "Nuevo seguidor";
        user.textContent = data.user || "chango_fan";
        detail.textContent = data.detail || "Gracias por sumarte a la banda";

        card.classList.remove("is-visible");
        void card.offsetWidth;
        card.classList.add("is-visible");

        window.clearTimeout(hideTimer);
        hideTimer = window.setTimeout(function () {
          card.classList.remove("is-visible");
        }, Number(data.duration || 6000));
      }

      window.showChangoAlert = showAlert;
      window.hideChangoAlert = hideAlert;

      window.addEventListener("message", function (event) {
        var data = event.data;
        if (data && data.type === "chango-alert") {
          showAlert(data);
        } else if (data && data.type === "chango-alert-hide") {
          hideAlert();
        }
      });

      if (window.ChangoLive) {
        window.ChangoLive.subscribe(null, function (cmd, payload) {
          if (cmd === "alert") {
            showAlert(payload);
          } else if (cmd === "alert-hide") {
            hideAlert();
          }
        });
      }

      if (window.CHANGO_CONFIG && window.CHANGO_CONFIG.showDemoAlerts) {
        window.setTimeout(function () {
          showAlert({
            icon: "+",
            label: "Nuevo seguidor",
            user: "tarija_rock",
            detail: "Gracias por sumarte a la banda",
            duration: 6000
          });
        }, 900);
      }
    })();
  </script>
</body>
</html>
